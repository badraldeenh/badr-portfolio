name: Add AVENA portfolio card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-avena-card.yml'

permissions:
  contents: write

jobs:
  integrate-avena:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add AVENA to Brand Identity section
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          if 'AVENA — Medical Center' in text:
              print('AVENA card already present; nothing to change.')
              raise SystemExit(0)

          anchor = '''        <p class="caseNote">Concept project created for portfolio presentation. Visual applications demonstrate the identity across a complete premium food retail experience.</p>
      </div>
    </section>'''

          replacement = '''        <p class="caseNote">Concept project created for portfolio presentation. Visual applications demonstrate the identity across a complete premium food retail experience.</p>

        <div class="caseIntro" style="margin-top:46px">
          <div><div class="eyebrow">AVENA — Medical Center</div><h3>Healthcare Brand Identity</h3><p>A complete medical-center identity system covering logo presentation, typography, stationery, uniforms, interior and exterior branding, digital booking UI, vehicle branding and campaign applications.</p></div>
          <span class="caseTag">Healthcare • Identity • Digital</span>
        </div>
        <a class="caseHero" href="avena.html" aria-label="View AVENA Medical Center case study"><img src="assets/img/avena-hero-4k.webp" alt="AVENA Medical Center brand identity case study" loading="lazy"></a>
        <div class="panel" style="margin-bottom:18px">
          <div class="eyebrow">Full Case Study</div>
          <h3>AVENA Medical Center</h3>
          <p>Explore the full visual identity from core brand system through environmental, uniform, vehicle, digital and social-media applications.</p>
          <div class="actions" style="margin-top:18px"><a class="btn primary" href="avena.html">View AVENA Case Study</a></div>
        </div>
        <p class="caseNote">Self-initiated healthcare branding concept created for portfolio presentation.</p>
      </div>
    </section>'''

          if anchor not in text:
              raise SystemExit('Expected HATAN section anchor was not found; index.html left unchanged.')

          text = text.replace(anchor, replacement, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit portfolio update
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add AVENA case study to portfolio"
          git push
