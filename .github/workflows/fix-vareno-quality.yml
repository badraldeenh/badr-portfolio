name: Fix VARENO presentation quality

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-vareno-quality.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Improve VARENO image presentation
        run: python3 .github/scripts/fix_vareno_quality.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-vareno-quality.yml .github/scripts/fix_vareno_quality.py
          git add index.html .github/workflows/fix-vareno-quality.yml .github/scripts/fix_vareno_quality.py
          if git diff --cached --quiet; then
            echo "Nothing to change"
            exit 0
          fi
          git commit -m "Improve VARENO image presentation quality"
          git push origin HEAD:main
