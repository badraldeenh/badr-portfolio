name: Integrate NORTHLINE

on:
  push:
    branches: [main]
    paths:
      - 'northline.html'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add NORTHLINE as featured project
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''\n    .northlineCover{min-height:360px;padding:34px;background:linear-gradient(135deg,#122536 0%,#173448 68%,#B87A50 185%);color:#F3F0E8;display:flex;align-items:flex-end;gap:28px}.northlineLogo{font-size:112px;line-height:.72;font-weight:900;color:#B87A50;letter-spacing:-.18em}.northlineCoverCopy{display:flex;flex-direction:column;gap:7px}.northlineCoverCopy span{font-weight:900;letter-spacing:.08em}.northlineCoverCopy small{letter-spacing:.24em;color:#d8a47d}.northlineCoverCopy strong{font-family:Georgia,serif;font-size:34px;line-height:1.02;font-weight:400;max-width:300px}.northlineCard{border-color:rgba(184,122,80,.55)}@media(max-width:620px){.northlineCover{min-height:300px;padding:26px}.northlineLogo{font-size:84px}.northlineCoverCopy strong{font-size:28px}}\n'''
          if '.northlineCover{' not in s:
              s=s.replace('</style>',css+'</style>',1)
          needle='<div class="brandPriorityGrid">'
          card='''\n          <a class="card brandPriorityCard northlineCard" href="/northline.html" aria-label="Open NORTHLINE Developments THE FOUNDRY case study"><div class="brandPriorityMedia northlineCover"><div class="northlineLogo">N</div><div class="northlineCoverCopy"><span>NORTHLINE DEVELOPMENTS</span><small>THE FOUNDRY</small><strong>Built for what’s next.</strong></div></div><div class="cardBody"><div class="kicker">Featured • Real Estate Brand Identity</div><h3>NORTHLINE Developments — THE FOUNDRY</h3><p>Complete identity system spanning logo, editorial, investor communication, outdoor graphics and digital applications.</p><span class="projectContext">Self-initiated portfolio concept</span><p class="projectContribution"><strong>My role:</strong> Brand identity, editorial design & art direction.</p><div class="miniChips"><span>Brand System</span><span>Editorial</span><span>Environmental</span><span>Digital</span></div></div></a>\n'''
          if 'href="/northline.html"' not in s:
              s=s.replace(needle,needle+card,1)
          p.write_text(s)
          PY
      - name: Commit homepage integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Feature NORTHLINE case study on homepage"
          git push
