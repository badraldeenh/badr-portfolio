name: Patch AVENA into portfolio index

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-avena-index.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch AVENA into latest index
        run: python3 .github/scripts/patch_avena.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/patch-avena-index.yml .github/scripts/patch_avena.py
          git add index.html .github/workflows/patch-avena-index.yml .github/scripts/patch_avena.py
          git commit -m "Add AVENA directly to portfolio index"
          git push origin HEAD:main
