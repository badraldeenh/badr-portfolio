name: Add AVENA to Brand Identity and Design

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-avena-design.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add AVENA to design section
        run: python3 .github/scripts/add_avena_design.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/add-avena-design.yml .github/scripts/add_avena_design.py
          git add index.html .github/workflows/add-avena-design.yml .github/scripts/add_avena_design.py
          if git diff --cached --quiet; then
            echo "Nothing to change"
            exit 0
          fi
          git commit -m "Add AVENA to Brand Identity and Design"
          git push origin HEAD:main
