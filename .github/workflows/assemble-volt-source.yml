name: Assemble VOLT Photoshop source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/assemble-volt-source.yml']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify original PSD
        run: |
          mkdir -p assets/volt
          cat .volt-upload/part-* > assets/volt/VOLT_Break_Gravity.psd
          echo 'f75edc5efce15f051f0f245902c41d93087d1eb4df06034ef35163b9d266fbe9  assets/volt/VOLT_Break_Gravity.psd' | sha256sum -c -
          rm -rf .volt-upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/volt/VOLT_Break_Gravity.psd .volt-upload
          git commit -m "Add verified original VOLT Photoshop download"
          git push
