name: Switch portfolio to CV-only tracking

on:
  push:
    paths:
      - '.github/workflows/cv-only-tracking.yml'

permissions:
  contents: write

jobs:
  cv-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove visitor analytics scripts and add CV click tracker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = []
          tracker = '<script defer src="/assets/js/cv-download-tracker.js?v=1"></script>'

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              original = text

              text = re.sub(r'\s*<!--\s*Vercel Web Analytics\s*-->\s*', '\n', text, flags=re.I)
              text = re.sub(r'\s*<script>\s*window\.va\s*=\s*window\.va\s*\|\|\s*function\s*\(\)\s*\{.*?</script>\s*', '\n', text, flags=re.I|re.S)
              text = re.sub(r'\s*<script[^>]*src=["\']/_vercel/insights/script\.js["\'][^>]*></script>\s*', '\n', text, flags=re.I)

              text = re.sub(r'\s*<!--\s*Vercel Speed Insights\s*-->\s*', '\n', text, flags=re.I)
              text = re.sub(r'\s*<script>\s*window\.si\s*=\s*window\.si\s*\|\|\s*function\s*\(\)\s*\{.*?</script>\s*', '\n', text, flags=re.I|re.S)
              text = re.sub(r'\s*<script[^>]*src=["\']/_vercel/speed-insights/script\.js["\'][^>]*></script>\s*', '\n', text, flags=re.I)

              if '/assets/js/cv-download-tracker.js' not in text and '</body>' in text.lower():
                  pos = text.lower().rfind('</body>')
                  text = text[:pos] + tracker + '\n' + text[pos:]

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Updated HTML files:')
          print('\n'.join(changed) if changed else 'none')
          PY

      - name: Commit CV-only tracking mode
        run: |
          git config user.name "Badr Portfolio Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No HTML changes needed"
            exit 0
          fi
          git commit -m "Remove visitor analytics and keep CV click tracking only"
          git push origin HEAD:main
