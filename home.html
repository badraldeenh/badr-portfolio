<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0d0f">
  <title>BADR Magic — Creative Portfolio</title>
  <style>html,body{margin:0;background:#0d0d0f;color:#f5f4f0;font-family:system-ui,sans-serif}#loading{min-height:100vh;display:grid;place-items:center;color:#a8a7a3}</style>
</head>
<body>
  <div id="loading">Loading portfolio…</div>
  <script>
    (async () => {
      try {
        const response = await fetch('/index.html?v=avena-5', {cache: 'no-store'});
        if (!response.ok) throw new Error('Could not load portfolio');
        const html = await response.text();
        const parsed = new DOMParser().parseFromString(html, 'text/html');

        const originalScripts = [...parsed.querySelectorAll('script')].map(s => ({src:s.src, text:s.textContent, type:s.type}));
        parsed.querySelectorAll('script').forEach(s => s.remove());

        document.head.innerHTML = parsed.head.innerHTML;
        document.body.innerHTML = parsed.body.innerHTML;

        const workWrap = document.querySelector('#work .wrap');
        if (workWrap && !document.getElementById('avena-feature')) {
          const sectionHead = document.querySelector('#work .sectionHead');
          const entry = document.createElement('div');
          entry.id = 'avena-feature';
          entry.style.scrollMarginTop = '90px';
          entry.innerHTML = `
            <div class="caseIntro" style="margin-top:0">
              <div>
                <div class="eyebrow">AVENA — Medical Center</div>
                <h3>Healthcare Brand Identity</h3>
                <p>A complete medical-center identity system covering logo presentation, typography, stationery, uniforms, interior and exterior branding, digital booking UI, vehicle branding and campaign applications.</p>
              </div>
              <span class="caseTag">Healthcare • Identity • Digital</span>
            </div>
            <a class="caseHero" href="/avena.html" aria-label="View AVENA Medical Center case study">
              <img src="/assets/img/avena-hero-4k.webp" alt="AVENA Medical Center brand identity case study" loading="eager">
            </a>
            <div class="panel" style="margin-bottom:34px">
              <div class="eyebrow">Featured Case Study</div>
              <h3>AVENA Medical Center</h3>
              <p>Explore the full visual identity from the core brand system through environmental, uniform, vehicle, digital and social-media applications.</p>
              <div class="actions" style="margin-top:18px"><a class="btn primary" href="/avena.html">View AVENA Case Study</a></div>
            </div>`;

          if (sectionHead) sectionHead.insertAdjacentElement('afterend', entry);
          else workWrap.prepend(entry);
        }

        const navLinks = document.querySelector('.links');
        if (navLinks && !navLinks.querySelector('a[href="#avena-feature"]')) {
          const workLink = navLinks.querySelector('a[href="#work"]');
          const avenaLink = document.createElement('a');
          avenaLink.href = '#avena-feature';
          avenaLink.textContent = 'AVENA';
          if (workLink) workLink.insertAdjacentElement('afterend', avenaLink);
          else navLinks.appendChild(avenaLink);
        }

        originalScripts.forEach(def => {
          const s = document.createElement('script');
          if (def.type) s.type = def.type;
          if (def.src) s.src = def.src;
          else s.textContent = def.text;
          document.body.appendChild(s);
        });

        requestAnimationFrame(() => {
          if (location.hash === '#work') {
            const target = document.getElementById('avena-feature');
            if (target) target.scrollIntoView({block:'start'});
          }
        });
      } catch (error) {
        document.body.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center"><div><h1>Portfolio</h1><p>Could not load the main page.</p><p><a href="/index.html" style="color:#c9a55a">Open portfolio</a> · <a href="/avena.html" style="color:#c9a55a">Open AVENA case study</a></p></div></div>';
      }
    })();
  </script>
</body>
</html>
