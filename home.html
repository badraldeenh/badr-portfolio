<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0d0f">
  <title>BADR Magic — Creative Portfolio</title>
  <style>html,body{margin:0;background:#0d0d0f;color:#f5f4f0;font-family:system-ui,sans-serif}#loading{min-height:100vh;display:grid;place-items:center;color:#a8a7a3}</style>
</head>
<body>
  <div id="loading">Loading portfolio…</div>
  <script>
    (async () => {
      try {
        const response = await fetch('/index.html?v=vareno-home-3', {cache:'no-store'});
        if (!response.ok) throw new Error('Could not load portfolio');
        const html = await response.text();
        const parsed = new DOMParser().parseFromString(html,'text/html');

        const originalScripts = [...parsed.querySelectorAll('script')]
          .filter(s => !s.textContent.includes('varenoAssets') && !s.textContent.includes('assets/vareno-data/'))
          .map(s => ({src:s.src,text:s.textContent,type:s.type}));
        parsed.querySelectorAll('script').forEach(s => s.remove());

        document.head.innerHTML = parsed.head.innerHTML;
        document.body.innerHTML = parsed.body.innerHTML;

        const qualityStyle = document.createElement('style');
        qualityStyle.textContent = `
          .varenoQualityHero,.varenoQualityShot{
            display:block!important;
            padding:0!important;
            overflow:hidden!important;
            background:#0b0b0d!important;
            border:1px solid #2b2b30!important;
          }
          .varenoQualityHero{
            border-radius:24px!important;
            box-shadow:0 28px 80px rgba(0,0,0,.34)!important;
          }
          .varenoQualityShot{border-radius:16px!important}
          .varenoQualityHero img,.varenoQualityShot img,
          [data-vareno-image]{
            display:block!important;
            width:100%!important;
            max-width:none!important;
            height:auto!important;
            object-fit:cover!important;
            margin:0!important;
            border-radius:0!important;
            box-shadow:none!important;
            filter:none!important;
            image-rendering:auto!important;
          }
          .varenoQualityHero .caseCaption,.varenoQualityShot .caseCaption{
            width:100%!important;
            margin:0!important;
            padding:14px 16px!important;
            background:#111113!important;
          }
          #vareno-case + .caseHero{margin-bottom:18px!important}
          #vareno-case ~ .caseGrid{
            columns:initial!important;
            display:grid!important;
            grid-template-columns:repeat(2,minmax(0,1fr))!important;
            gap:18px!important;
          }
          #vareno-case ~ .caseGrid .caseShot{margin:0!important}
          .vareno-home-cta{margin:18px 0 34px!important}
          @media(max-width:760px){
            #vareno-case ~ .caseGrid{grid-template-columns:1fr!important}
          }
        `;
        document.head.appendChild(qualityStyle);

        const varenoAssets = {
          hero:'/assets/img/vareno/vareno-hero.webp',
          identity:'/assets/img/vareno/vareno-identity.webp',
          applications:'/assets/img/vareno/vareno-final-showcase.webp',
          final:'/assets/img/vareno/vareno-final-showcase.webp'
        };
        Object.entries(varenoAssets).forEach(([key,src]) => {
          document.querySelectorAll(`[data-vareno-image="${key}"]`).forEach(img => {
            img.src = src;
            img.removeAttribute('srcset');
            img.removeAttribute('width');
            img.removeAttribute('height');
          });
        });

        const varenoCase = document.getElementById('vareno-case');
        if (varenoCase && !document.querySelector('.vareno-home-cta')) {
          const hero = varenoCase.nextElementSibling;
          const cta = document.createElement('div');
          cta.className = 'actions vareno-home-cta';
          cta.innerHTML = '<a class="btn primary" href="/vareno/">View Full VARENO Case Study →</a>';
          if (hero) hero.insertAdjacentElement('afterend',cta);
        }

        const workWrap = document.querySelector('#work .wrap');
        if (workWrap && !document.getElementById('avena-feature')) {
          const sectionHead = document.querySelector('#work .sectionHead');
          const entry = document.createElement('div');
          entry.id = 'avena-feature';
          entry.style.scrollMarginTop = '90px';
          entry.innerHTML = `
            <div class="caseIntro" style="margin-top:0">
              <div>
                <div class="eyebrow">AVENA — Medical Center</div>
                <h3>Healthcare Brand Identity</h3>
                <p>A complete medical-center identity system covering logo presentation, typography, stationery, uniforms, interior and exterior branding, digital booking UI, vehicle branding and campaign applications.</p>
              </div>
              <span class="caseTag">Healthcare • Identity • Digital</span>
            </div>
            <a class="caseHero" href="/avena.html" aria-label="View AVENA Medical Center case study">
              <img src="/assets/img/avena-hero-4k.webp" alt="AVENA Medical Center brand identity case study" loading="eager">
            </a>
            <div class="panel" style="margin-bottom:34px">
              <div class="eyebrow">Featured Case Study</div>
              <h3>AVENA Medical Center</h3>
              <p>Explore the full visual identity from the core brand system through environmental, uniform, vehicle, digital and social-media applications.</p>
              <div class="actions" style="margin-top:18px"><a class="btn primary" href="/avena.html">View AVENA Case Study</a></div>
            </div>`;
          if (sectionHead) sectionHead.insertAdjacentElement('afterend',entry);
          else workWrap.prepend(entry);
        }

        const navLinks = document.querySelector('.links');
        if (navLinks && !navLinks.querySelector('a[href="#avena-feature"]')) {
          const workLink = navLinks.querySelector('a[href="#work"]');
          const avenaLink = document.createElement('a');
          avenaLink.href = '#avena-feature';
          avenaLink.textContent = 'AVENA';
          if (workLink) workLink.insertAdjacentElement('afterend',avenaLink);
          else navLinks.appendChild(avenaLink);
        }

        originalScripts.forEach(def => {
          const s = document.createElement('script');
          if (def.type) s.type = def.type;
          if (def.src) s.src = def.src;
          else s.textContent = def.text;
          document.body.appendChild(s);
        });

        requestAnimationFrame(() => {
          if (location.hash === '#work') {
            const target = document.getElementById('avena-feature');
            if (target) target.scrollIntoView({block:'start'});
          }
        });
      } catch (error) {
        document.body.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center"><div><h1>Portfolio</h1><p>Could not load the main page.</p><p><a href="/index.html" style="color:#c9a55a">Open portfolio</a> · <a href="/avena.html" style="color:#c9a55a">Open AVENA case study</a></p></div></div>';
      }
    })();
  </script>
</body>
</html>
