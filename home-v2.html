<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.ico?v=badr-1" sizes="any" />
  <link rel="icon" type="image/png" href="/favicon-32x32.png?v=badr-1" sizes="32x32" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=badr-1" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=badr-1" sizes="180x180" />

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0d0f">
  <title>BADR Magic — Creative Portfolio</title>
  <style>html,body{margin:0;background:#0d0d0f;color:#f5f4f0;font-family:system-ui,sans-serif}#loading{min-height:100vh;display:grid;place-items:center;color:#a8a7a3}</style>
</head>
<body>
  <div id="loading">Loading portfolio…</div>
  <script>
  (async function(){
    try{
      const res=await fetch('/index.html?v=vareno-static-10',{cache:'no-store'});
      if(!res.ok) throw new Error('Could not load portfolio');
      const source=await res.text();
      const doc=new DOMParser().parseFromString(source,'text/html');

      // Remove the obsolete VARENO base64 loader before the final document is rendered.
      [...doc.querySelectorAll('script')].forEach(s=>{
        const t=s.textContent||'';
        if(t.includes('varenoAssets')||t.includes('assets/vareno-data/')) s.remove();
      });

      const oldStart=doc.getElementById('vareno-case');
      if(oldStart){
        let boundary=oldStart.nextElementSibling;
        while(boundary){
          if(boundary.classList?.contains('caseIntro') && /HATAN/i.test(boundary.textContent||'')) break;
          boundary=boundary.nextElementSibling;
        }
        const parent=oldStart.parentNode;
        let n=oldStart;
        while(n && n!==boundary){
          const next=n.nextElementSibling;
          n.remove();
          n=next;
        }

        const section=doc.createElement('div');
        section.id='vareno-showcase';
        section.className='vareno-live-showcase';
        section.innerHTML=`
          <div class="vr-title">
            <div>
              <div class="eyebrow">VARENO — Barber Club</div>
              <h3>Luxury Grooming Brand Identity</h3>
              <p>A complete premium grooming identity shown with large high-resolution project visuals.</p>
            </div>
            <span class="caseTag">Branding • Art Direction • Digital</span>
          </div>

          <a class="vr-hero" href="/vareno/" aria-label="Open VARENO full case study">
            <img src="/assets/img/vareno/vareno-hero.webp?v=10" alt="VARENO Barber Club premium identity hero">
          </a>
          <div class="vr-actions"><a class="btn primary" href="/vareno/">View Full VARENO Case Study →</a></div>

          <div class="vr-grid vr-grid-2">
            <figure><img src="/assets/img/vareno/vareno-identity.webp?v=10" alt="VARENO identity system"><figcaption><b>Identity System</b><span>Logo • Monogram</span></figcaption></figure>
            <figure><img src="/assets/img/vareno/vareno-guidelines.webp?v=10" alt="VARENO brand guidelines"><figcaption><b>Brand Guidelines</b><span>Color • Typography</span></figcaption></figure>
          </div>

          <div class="vr-grid vr-grid-3">
            <figure><img src="/assets/img/vareno/vareno-exterior.webp?v=10" alt="VARENO exterior branding"><figcaption><b>Exterior Branding</b><span>Facade • Signage</span></figcaption></figure>
            <figure><img src="/assets/img/vareno/vareno-stationery.webp?v=10" alt="VARENO stationery"><figcaption><b>Stationery</b><span>Print • Cards</span></figcaption></figure>
            <figure><img src="/assets/img/vareno/vareno-digital.webp?v=10" alt="VARENO digital touchpoints"><figcaption><b>Digital Touchpoints</b><span>Booking • Social</span></figcaption></figure>
          </div>

          <figure class="vr-final"><img src="/assets/img/vareno/vareno-final-showcase.webp?v=10" alt="VARENO final brand showcase"><figcaption><b>Final Brand Showcase</b><span>Complete Visual Identity</span></figcaption></figure>
        `;
        parent.insertBefore(section,boundary||null);
      }

      const css=doc.createElement('style');
      css.textContent=`
        #vareno-showcase{margin:44px 0 68px;scroll-margin-top:90px}
        #vareno-showcase .vr-title{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;margin-bottom:24px}
        #vareno-showcase .vr-title h3{font-size:clamp(34px,5vw,56px);line-height:1.02;margin:4px 0 10px;letter-spacing:-.045em}
        #vareno-showcase .vr-title p{margin:0;color:#aaa69d;max-width:760px;font-size:16px}
        #vareno-showcase figure,#vareno-showcase .vr-hero{margin:0;border:1px solid #2b2b30;border-radius:22px;overflow:hidden;background:#09090b;box-shadow:0 24px 70px rgba(0,0,0,.28)}
        #vareno-showcase img{display:block;width:100%!important;max-width:none!important;height:auto!important;object-fit:contain!important;margin:0!important;border-radius:0!important;box-shadow:none!important;filter:none!important}
        #vareno-showcase .vr-hero{display:block;width:100%;margin-bottom:18px}
        #vareno-showcase .vr-actions{margin:18px 0 26px}
        #vareno-showcase .vr-grid{display:grid;gap:18px;margin:18px 0}
        #vareno-showcase .vr-grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
        #vareno-showcase .vr-grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
        #vareno-showcase figcaption{padding:14px 16px;background:#111113;border-top:1px solid #25252a;display:flex;justify-content:space-between;gap:12px;color:#d7d4cc;font-size:13px}
        #vareno-showcase figcaption span{color:#c9a55a;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
        #vareno-showcase .vr-final{margin-top:18px}
        @media(max-width:900px){#vareno-showcase .vr-grid-3{grid-template-columns:1fr 1fr}}
        @media(max-width:680px){#vareno-showcase .vr-title{grid-template-columns:1fr}#vareno-showcase .vr-grid-2,#vareno-showcase .vr-grid-3{grid-template-columns:1fr}}
      `;
      doc.head.appendChild(css);

      const marker=doc.createElement('meta');
      marker.name='vareno-build';
      marker.content='static-10';
      doc.head.appendChild(marker);

      const scrollScript=doc.createElement('script');
      scrollScript.textContent=`window.addEventListener('load',()=>{if(location.hash==='#vareno-showcase')document.getElementById('vareno-showcase')?.scrollIntoView({block:'start'});});`;
      doc.body.appendChild(scrollScript);

      const final='<!DOCTYPE html>\n'+doc.documentElement.outerHTML;
      document.open();
      document.write(final);
      document.close();
    }catch(e){
      document.body.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center"><div><h1>Portfolio</h1><p>Could not load the portfolio.</p><p><a href="/index.html" style="color:#c9a55a">Open direct version</a></p></div></div>';
    }
  })();
  </script>
</body>
</html>
